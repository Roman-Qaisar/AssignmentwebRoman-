<text x="450" y="545" font-family="Arial, sans-serif" font-size="29" font-weight="700" text-anchor="middle" fill="#19363b">ShopEasy</text>
<text x="450" y="578" font-family="Arial, sans-serif" font-size="17" text-anchor="middle" fill="#60746d">Product photo unavailable</text>
</svg>